# cargo-about configuration for mikrotik-rif.
#
# Regenerate THIRD-PARTY-NOTICES.md with the pinned tool version:
#   cargo install cargo-about --locked --version 0.9.2 --features cli
#   cargo fetch --locked
#   cargo about generate about.hbs --output-file THIRD-PARTY-NOTICES.md --fail --frozen
#
# The accepted list mirrors the `[licenses] allow` policy in deny.toml. Keep the
# two in sync: an unaccepted license here fails `cargo about clarify`/review,
# and an unaccepted license in deny.toml fails `cargo deny check licenses`.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Intentionally no `targets` list. cargo-about then keeps every
# platform-specific dependency in the resolved graph instead of filtering to a
# single host triple. That is broader than the shipped set (Windows/macOS/Linux,
# x86_64 + arm64 - see .github/workflows/build.yml), which is the safe
# direction: a notice for a crate that is not linked is harmless, a missing one
# is a licence violation.
