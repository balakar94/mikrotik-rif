name: Build

on:
  # Manual runs: build and upload the installers without publishing.
  workflow_dispatch:
  # Called by release.yml so the packaging matrix lives in exactly one place.
  workflow_call:

# Read-only: this workflow only builds and uploads artifacts; publishing lives
# in the caller (release.yml).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Never cancel an in-progress tag build: a release must be able to finish even
# if another build is queued on the same ref. Superseded non-tag runs (manual
# dispatches, branch builds) may be cancelled to save runner minutes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform/architecture failing must not cancel the others; partial
      # artifacts are still useful for diagnosis.
      fail-fast: false
      matrix:
        include:
          # x86_64 (existing)
          - name: windows x64
            os: windows-latest
            arch: x64
            formats: "wix,nsis"
            artifact: release-windows-x64
            files: |
              dist/*.msi
              dist/*.exe
          - name: macos arm64
            os: macos-latest
            arch: arm64
            formats: "app,dmg"
            artifact: release-macos-arm64
            files: |
              dist/*.dmg
              dist/*.app.zip
          - name: linux x64
            os: ubuntu-latest
            arch: x64
            formats: "deb,appimage"
            artifact: release-linux-x64
            files: |
              dist/*.deb
              dist/*.AppImage
              dist/*.rpm
          # arm64 (new). Native arm64 standard GitHub-hosted runners are GA
          # and available in private repositories (GitHub changelog
          # 2026-01-29; docs.github.com "GitHub-hosted runners reference").
          - name: windows arm64
            os: windows-11-arm
            arch: arm64
            formats: "wix,nsis"
            artifact: release-windows-arm64
            files: |
              dist/*.msi
              dist/*.exe
          - name: linux arm64
            os: ubuntu-24.04-arm
            arch: arm64
            formats: "deb,appimage"
            artifact: release-linux-arm64
            files: |
              dist/*.deb
              dist/*.AppImage
              dist/*.rpm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # eframe 0.36 builds winit (x11 + wayland) and wgpu (Vulkan) on Linux.
      # rfd 0.17.2 defaults to xdg-portal + wayland, so GTK3 is not needed;
      # Cargo.lock has no openssl-sys, so libssl-dev is not needed either.
      # The same package set exists for arm64 on Ubuntu 24.04 (and the arm64
      # image ships patchelf 0.18.0, which linuxdeploy uses for AppImage).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # cargo-packager does NOT compile the application itself (verified in
      # its README: "By default, the packager doesn't build your application").
      # It detects the host target automatically, so each native runner builds
      # and packages its own architecture. Build the release profile exactly
      # once here; every packager step below consumes these artifacts via
      # `cargo packager --release`.
      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      # Package names embed the target architecture, so the x64 and arm64
      # artifacts never collide:
      #   MSI  mikrotik-rif_<version>_x64_<lang>.msi / _arm64_<lang>.msi
      #   NSIS mikrotik-rif_<version>_x64-setup.exe / _arm64-setup.exe
      #   DEB  mikrotik-rif_<version>_amd64.deb / _arm64.deb
      #   AppImage mikrotik-rif_<version>_x86_64.AppImage / _aarch64.AppImage
      - name: Package installers (cargo-packager)
        run: cargo packager --release --formats ${{ matrix.formats }}

      # RPM is intentionally not part of cargo-packager (its PackageFormat enum
      # only has App/Dmg/Wix/Nsis/Deb/AppImage/Pacman). cargo-generate-rpm
      # consumes the [package.metadata.generate-rpm] table in Cargo.toml; it
      # names the file with the host arch (x86_64 / aarch64), so no collision.
      - name: Install cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked --version 0.21.0

      - name: Generate .rpm package (cargo-generate-rpm)
        if: runner.os == 'Linux'
        run: cargo generate-rpm --output dist

      # A zipped .app preserves symlinks/permissions and is what GitHub Release
      # consumers expect (softprops/action-gh-release cannot upload a directory).
      - name: Bundle macOS .app into a zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${app}" ]; then
            echo "No .app bundle found in dist/" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "${app}" "dist/MikroTik-RIF-Viewer.app.zip"

      - name: Show packaged files
        shell: bash
        run: |
          set -euo pipefail
          ls -lR dist

      # Artifacts are attached to the workflow run. When this workflow is
      # invoked via workflow_call, that run is the caller's run (they share
      # github.run_id), so the caller can download these with
      # actions/download-artifact's default run-id of ${{ github.run_id }}.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
