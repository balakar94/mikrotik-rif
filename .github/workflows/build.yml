name: Build

on:
  # Manual runs: build and upload the installers without publishing.
  workflow_dispatch:
  # Called by release.yml so the packaging matrix lives in exactly one place.
  workflow_call:

# Read-only: this workflow only builds and uploads artifacts; publishing lives
# in the caller (release.yml).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Never cancel an in-progress tag build: a release must be able to finish even
# if another build is queued on the same ref. Superseded non-tag runs (manual
# dispatches, branch builds) may be cancelled to save runner minutes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform/architecture failing must not cancel the others; partial
      # artifacts are still useful for diagnosis.
      fail-fast: false
      matrix:
        include:
          # x86_64 (existing)
          - name: windows x64
            os: windows-latest
            arch: x64
            formats: "nsis"
            artifact: release-windows-x64
            files: |
              dist/*.exe
          - name: macos arm64
            os: macos-latest
            arch: arm64
            formats: "dmg"
            artifact: release-macos-arm64
            files: |
              dist/*.dmg
          - name: linux x64
            os: ubuntu-latest
            arch: x64
            formats: "deb,appimage"
            artifact: release-linux-x64
            files: |
              dist/*.deb
              dist/*.AppImage
              dist/*.rpm
          # arm64 (new). Native arm64 standard GitHub-hosted runners are GA
          # and available in private repositories (GitHub changelog
          # 2026-01-29; docs.github.com "GitHub-hosted runners reference").
          #
          # NSIS only, no WiX on either Windows job. cargo-packager's WiX
          # 3.11.2 `candle.exe` is an x86 .NET Framework 3.5 tool and dies
          # on this runner (observed in the v0.1.0 run: "Error running
          # candle.exe", exit 1), while NSIS is a native Win32 tool that
          # packages fine. The unsigned MSI also buys nothing over the
          # unsigned NSIS installer for manual installs, so both Windows
          # jobs ship a single `-setup.exe` each.
          - name: windows arm64
            os: windows-11-arm
            arch: arm64
            formats: "nsis"
            artifact: release-windows-arm64
            files: |
              dist/*.exe
          - name: linux arm64
            os: ubuntu-24.04-arm
            arch: arm64
            formats: "deb,appimage"
            artifact: release-linux-arm64
            files: |
              dist/*.deb
              dist/*.AppImage
              dist/*.rpm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # eframe 0.36 builds winit (x11 + wayland) and wgpu (Vulkan) on Linux.
      # rfd 0.17.2 defaults to xdg-portal + wayland, so GTK3 is not needed;
      # Cargo.lock has no openssl-sys, so libssl-dev is not needed either.
      # The same package set exists for arm64 on Ubuntu 24.04 (and the arm64
      # image ships patchelf 0.18.0, which linuxdeploy uses for AppImage).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # cargo-packager does NOT compile the application itself (verified in
      # its README: "By default, the packager doesn't build your application").
      # It detects the host target automatically, so each native runner builds
      # and packages its own architecture. Build the release profile exactly
      # once here; every packager step below consumes these artifacts via
      # `cargo packager --release`.
      - name: Build release binary
        env:
          # Optional release-signing public key (minisign, base64). Set it as a
          # repository *variable* (public keys are not secret): when present the
          # built binary requires a valid `SHA256SUMS.txt.minisig` on every
          # release, which release.yml produces from the MINISIGN_SECRET_KEY
          # secret. Configure the variable and the secret together, or leave
          # both unset; a lone variable makes updates fail closed.
          MIKROTIK_RIF_MINISIGN_PUBKEY: ${{ vars.MIKROTIK_RIF_MINISIGN_PUBKEY }}
        run: cargo build --release --locked

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      # Each tool names its output its own way (cargo-packager after the binary
      # and per-format arch spellings, cargo-generate-rpm after the RPM NEVRA,
      # the macOS disk image after the product). Every artifact is renamed to
      # one scheme in the "Normalise release asset names" step below:
      #   mikrotik-rif_<version>_<arch>.deb|.rpm|.AppImage|.dmg
      #   mikrotik-rif_<version>_<arch>-setup.exe
      - name: Package installers (cargo-packager)
        # ROOT CAUSE (verified in cargo-packager 0.11.8 source,
        # crates/packager/src/package/dmg/mod.rs):
        #
        #   if let Some(value) = std::env::var_os("CI") {
        #       if value == "true" {
        #           bundle_dmg_cmd.arg("--skip-jenkins");
        #       }
        #   }
        #
        # GitHub Actions exports CI=true, so the macOS .dmg was produced with
        # create-dmg's `--skip-jenkins`. That flag skips the Finder AppleScript
        # which is the only thing that writes the volume's .DS_Store. Finder
        # uses .DS_Store to know the icon layout and the window background, so
        # without it the `[package.metadata.packager.dmg] background` PNG is
        # embedded in the .dmg but never shown (the "no wallpaper" bug).
        #
        # FIX: force CI=false for this step ONLY on macOS. The check above is
        # an exact string compare against "true", so "false" reliably suppresses
        # `--skip-jenkins`. Linux and Windows keep CI=true: their packaging
        # paths (NSIS, .deb, AppImage) never read CI, so nothing changes there.
        #
        # ROLLBACK: delete this `env:` block (or revert this step). CI then
        # stays "true" on macOS again and create-dmg runs with `--skip-jenkins`:
        # the .dmgs lose the background and the .DS_Store verification step
        # below will fail the build.
        env:
          CI: ${{ runner.os == 'macOS' && 'false' || 'true' }}
        # create-dmg's Finder AppleScript (now enabled on macOS) has no timeout
        # of its own and waits on Finder to write .DS_Store. Bound the step so a
        # headless runner that never writes it fails in 30 minutes instead of
        # burning the job's 360-minute default.
        timeout-minutes: 30
        run: cargo packager --release --formats ${{ matrix.formats }}

      # RPM is intentionally not part of cargo-packager (its PackageFormat enum
      # only has App/Dmg/Wix/Nsis/Deb/AppImage/Pacman). cargo-generate-rpm
      # consumes the [package.metadata.generate-rpm] table in Cargo.toml; it
      # names the file with the host arch (x86_64 / aarch64), so no collision.
      - name: Install cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked --version 0.21.0

      - name: Generate .rpm package (cargo-generate-rpm)
        if: runner.os == 'Linux'
        run: cargo generate-rpm --output dist

      # Self-verification of the macOS background fix above. create-dmg writes
      # the volume's .DS_Store only when its Finder AppleScript runs (i.e. when
      # `--skip-jenkins` is absent). Mount the freshly built .dmg read-only and
      # fail if .DS_Store is missing at the volume root, so a silent regression
      # (the CI override being dropped, the AppleScript being skipped, or the
      # background being changed) breaks the build instead of shipping a plain
      # .dmg. macOS only: only the .dmg has a Finder background.
      #
      # The TTY-less mount below doubles as the guard against a click-through
      # EULA: if `license-file` is ever re-added to [package.metadata.packager],
      # cargo-packager passes it to create-dmg as `--eula` and `hdiutil attach`
      # aborts with "attach canceled" (run 34793505291). The explicit
      # `udifderez` check first turns that into an actionable message instead of
      # one that blames `--skip-jenkins`.
      - name: Verify .dmg volume background (.DS_Store)
        if: runner.os == 'macOS'
        shell: bash
        # Bound hdiutil in case mounting the image ever stalls; the image is
        # ~17 MB, so 10 minutes is far beyond any healthy mount.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dmg=""
          for candidate in dist/*.dmg; do
            [ -f "${candidate}" ] || continue
            dmg="${candidate}"
            break
          done
          if [ -z "${dmg}" ]; then
            echo "ERROR: no .dmg found in dist/ to verify on macOS" >&2
            exit 1
          fi
          # A DMG that carries a software licence agreement makes hdiutil print
          # the licence and wait for "yes"; headless it reads EOF and cancels.
          # Detect the agreement resources (LPic/TEXT, applied by create-dmg's
          # `--eula` -> hdiutil udifrez) before mounting, so the failure names
          # the real cause. hdiutil udifderez is deprecated but still present,
          # and we fail closed if it ever disappears or errors. ROLLBACK: delete
          # this guard; the attach below still fails, just with the generic
          # `.DS_Store` message.
          if ! rez="$(hdiutil udifderez "${dmg}" 2>/dev/null)"; then
            echo "ERROR: hdiutil udifderez failed on '${dmg}', so an embedded" >&2
            echo "ERROR: EULA cannot be ruled out. Refusing to continue." >&2
            exit 1
          fi
          if printf '%s\n' "${rez}" | grep -Eq '<key>(LPic|STR#|TEXT|RTF )</key>'; then
            echo "ERROR: '${dmg}' carries a software licence agreement (LPic/" >&2
            echo "ERROR: TEXT resources), which cannot be mounted without" >&2
            echo "ERROR: interactive acceptance. Likely cause: license-file is" >&2
            echo "ERROR: set in [package.metadata.packager] in Cargo.toml, so" >&2
            echo "ERROR: cargo-packager passed create-dmg --eula. See the key's" >&2
            echo "ERROR: comment; the DMG must stay EULA-free for headless" >&2
            echo "ERROR: mounts (see docs/RELEASE.md)." >&2
            exit 1
          fi
          echo "Verifying '${dmg}' contains a root .DS_Store"
          mountpoint="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rifmnt.XXXXXX")"
          # Always detach, even when the check below fails: a leftover mount
          # would keep the image busy and can break later steps. --force is the
          # last resort; the mount is read-only so detaching is safe.
          # ROLLBACK for this step: delete it (and the env override above).
          cleanup() {
            hdiutil detach "${mountpoint}" -quiet \
              || hdiutil detach "${mountpoint}" -force -quiet \
              || true
            rmdir "${mountpoint}" 2>/dev/null || true
          }
          trap cleanup EXIT
          # -nobrowse stops Finder auto-opening the volume; -readonly makes sure
          # the image is never mutated by this check.
          hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mountpoint}"
          if [ ! -f "${mountpoint}/.DS_Store" ]; then
            echo "ERROR: '${dmg}' has no .DS_Store at the volume root, so Finder" >&2
            echo "ERROR: will not apply the custom background. Most likely the" >&2
            echo "ERROR: cargo-packager step passed --skip-jenkins because CI was" >&2
            echo "ERROR: 'true'; check the CI override on that step." >&2
            exit 1
          fi
          ls -la "${mountpoint}/.DS_Store"
          echo "OK: '${dmg}' contains a root .DS_Store; DMG background is set."

      # Rename every artifact to the single release scheme, with the
      # architecture token in {amd64, arm64}:
      #   mikrotik-rif_<version>_<arch>.deb|.rpm|.AppImage|.dmg
      #   mikrotik-rif_<version>_<arch>-setup.exe
      # Two reasons: the packaging tools each invent their own name (the macOS
      # disk image gets the product name, cargo-generate-rpm uses the RPM
      # NEVRA with its "-1" release, cargo-packager mixes arch spellings), and
      # GitHub Releases rewrites spaces in uploaded file names while
      # SHA256SUMS.txt is generated from the local names, so a mismatch breaks
      # both `sha256sum -c` and the updater's checksum lookup. The updater's
      # asset table in src/update.rs matches these exact names.
      - name: Normalise release asset names
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "${version}" ]; then
            echo "ERROR: could not read the version from Cargo.toml" >&2
            exit 1
          fi
          case "${{ matrix.arch }}" in
            x64) arch="amd64" ;;
            arm64) arch="arm64" ;;
            *)
              echo "ERROR: unknown matrix arch '${{ matrix.arch }}'" >&2
              exit 1
              ;;
          esac
          for file in dist/*; do
            [ -f "${file}" ] || continue
            case "${file}" in
              *.deb) ext=".deb" ;;
              *.rpm) ext=".rpm" ;;
              *.AppImage) ext=".AppImage" ;;
              *.dmg) ext=".dmg" ;;
              *-setup.exe) ext="-setup.exe" ;;
              *)
                echo "WARNING: leaving unrecognised artifact '${file}' alone" >&2
                continue
                ;;
            esac
            target="dist/mikrotik-rif_${version}_${arch}${ext}"
            if [ "${file}" != "${target}" ]; then
              echo "Renaming '${file}' -> '${target}'"
              mv "${file}" "${target}"
            fi
          done

      # R1: the upload step below uses several globs, but
      # `if-no-files-found: error` only fails when NO pattern matches at all,
      # so a partial loss (e.g. .deb built but .rpm missing) would go
      # unnoticed. Fail fast here if any format expected for this runner OS
      # is absent from dist/.
      - name: Assert packaged files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          fail() { echo "ERROR: $*" >&2; missing=1; }
          case "${{ runner.os }}" in
            Windows)
              compgen -G 'dist/*.exe' > /dev/null \
                || fail "missing Windows installer: expected 'dist/*.exe' (NSIS setup)"
              ;;
            macOS)
              compgen -G 'dist/*.dmg' > /dev/null \
                || fail "missing macOS installer: expected 'dist/*.dmg'"
              ;;
            Linux)
              compgen -G 'dist/*.deb' > /dev/null \
                || fail "missing Linux package: expected 'dist/*.deb'"
              compgen -G 'dist/*.AppImage' > /dev/null \
                || fail "missing Linux package: expected 'dist/*.AppImage'"
              compgen -G 'dist/*.rpm' > /dev/null \
                || fail "missing Linux package: expected 'dist/*.rpm' (cargo-generate-rpm)"
              ;;
            *)
              echo "ERROR: unsupported runner OS: '${{ runner.os }}'" >&2
              exit 1
              ;;
          esac
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: one or more expected packaged files are missing for OS '${{ runner.os }}'" >&2
            exit 1
          fi
          echo "All expected packaged files present for OS '${{ runner.os }}'."

      - name: Show packaged files
        shell: bash
        run: |
          set -euo pipefail
          ls -lR dist

      # Artifacts are attached to the workflow run. When this workflow is
      # invoked via workflow_call, that run is the caller's run (they share
      # github.run_id), so the caller can download these with
      # actions/download-artifact's default run-id of ${{ github.run_id }}.
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
