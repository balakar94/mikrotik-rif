name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Read-only: CI never writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A failure on one OS must not hide failures on the others.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # eframe 0.36 pulls winit (x11 + wayland backends) and wgpu (Vulkan
      # backend) on Linux. These -dev packages provide the pkg-config/headers
      # those crates build against. Verified against:
      #   - eframe/egui Linux prerequisites:
      #     https://github.com/emilk/egui/blob/main/crates/eframe/README.md
      #   - rfd 0.17.2 default features are `xdg-portal` + `wayland`
      #     (no GTK3), so libgtk-3-dev is NOT required.
      #   - Cargo.lock contains no openssl-sys, so libssl-dev is NOT required.
      # libudev-dev/libasound2-dev are only needed for gamepad/audio features
      # that this app does not enable.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Formatting is OS-independent; run it exactly once.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked
