name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Required by softprops/action-gh-release to create/update the GitHub Release.
# The reusable build workflow is capped at contents: read by its call job below,
# so the broader write grant is not inherited by the build matrix.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: package installers
    # Reusable workflow call: the whole per-platform matrix lives in build.yml.
    uses: ./.github/workflows/build.yml
    # Artifacts uploaded by the called workflow belong to this same run (they
    # share github.run_id), so the release job below downloads them with
    # actions/download-artifact's default run-id of ${{ github.run_id }}.
    permissions:
      contents: read

  release:
    name: publish GitHub Release
    needs: build
    # Only a version tag publishes; workflow_dispatch keeps artifacts only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            Unsigned build: no Apple or Windows code-signing certificates are used.

            ### macOS — Gatekeeper
            The app is not notarized, so macOS may block the first launch.
            Drag the app to `/Applications`, then either:

            - right-click (or Control-click) the app, choose **Open**, and confirm
              **Open** again, or
            - clear the quarantine attribute in a terminal:

              ```bash
              xattr -dr com.apple.quarantine "/Applications/MikroTik RIF Viewer.app"
              ```

            ### Windows — SmartScreen
            Installers are provided for x64 and arm64; the architecture is part of
            the file name (`..._x64...` or `..._arm64...`). The installers are not
            code-signed. If you see "Windows protected your PC", click
            **More info**, then **Run anyway**.

            ### Linux
            Both x86_64 and arm64 packages are provided; the architecture is part
            of the file name.

            - Debian/Ubuntu: `sudo apt install ./mikrotik-rif_*_amd64.deb`
              (x86_64) or `./mikrotik-rif_*_arm64.deb` (arm64)
            - AppImage: `chmod +x mikrotik-rif_*_x86_64.AppImage && ./mikrotik-rif_*_x86_64.AppImage`
              (x86_64) or `mikrotik-rif_*_aarch64.AppImage` (arm64)
            - Fedora/RHEL: `sudo dnf install ./mikrotik-rif-*.x86_64.rpm`
              (x86_64) or `./mikrotik-rif-*.aarch64.rpm` (arm64)
          files: |
            dist/*
