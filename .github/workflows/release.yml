name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Required by softprops/action-gh-release to create/update the GitHub Release.
# The reusable build workflow is capped at contents: read by its call job below,
# so the broader write grant is not inherited by the build matrix.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: package installers
    # Reusable workflow call: the whole per-platform matrix lives in build.yml.
    uses: ./.github/workflows/build.yml
    # Artifacts uploaded by the called workflow belong to this same run (they
    # share github.run_id), so the release job below downloads them with
    # actions/download-artifact's default run-id of ${{ github.run_id }}.
    permissions:
      contents: read

  release:
    name: publish GitHub Release
    needs: build
    # Only a version tag publishes; workflow_dispatch keeps artifacts only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            Desktop viewer for MikroTik RouterOS support captures (`supout.rif`).

            ## Downloads

            Every file is named `mikrotik-rif_<version>_<arch>.<ext>`, where
            `<arch>` is `amd64` (64-bit Intel/AMD) or `arm64`:

            | Platform | Package |
            | --- | --- |
            | Windows | `-setup.exe` installer |
            | macOS (Apple Silicon) | `.dmg` disk image (drag the app to Applications) |
            | Debian / Ubuntu | `.deb` |
            | Fedora / RHEL | `.rpm` |
            | Linux (any distribution) | portable `.AppImage` |

            ## Install

            ```sh
            # Debian / Ubuntu
            sudo apt install ./mikrotik-rif_<version>_amd64.deb

            # Fedora / RHEL
            sudo dnf install ./mikrotik-rif_<version>_amd64.rpm

            # AppImage (any Linux)
            chmod +x mikrotik-rif_<version>_amd64.AppImage && ./mikrotik-rif_<version>_amd64.AppImage
            ```

            Replace `amd64` with `arm64` on 64-bit ARM machines. On Windows run the
            `-setup.exe`; on macOS open the `.dmg` and drag the app into `/Applications`.

            ## Verify the download

            Every file is listed in `SHA256SUMS.txt`. From the folder holding the
            downloads:

            ```sh
            sha256sum -c SHA256SUMS.txt
            ```

            ## First launch (these builds are not code-signed)

            No Apple or Windows code-signing certificate is used, so each system
            warns once the first time:

            - **macOS** — Gatekeeper blocks the app: right-click it, choose **Open**,
              then **Open** again. Or clear the quarantine flag:

              ```sh
              xattr -dr com.apple.quarantine "/Applications/MikroTik RIF Viewer.app"
              ```

            - **Windows** — SmartScreen shows "Windows protected your PC": choose
              **More info**, then **Run anyway**.
          files: |
            dist/*
