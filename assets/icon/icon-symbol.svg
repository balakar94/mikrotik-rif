<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#03060C"/>
    </linearGradient>

    <linearGradient id="rim-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="glow-c" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="check-grad-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-c)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#glow-c)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" ry="102.5" fill="none" stroke="url(#rim-c)" stroke-width="3"/>

  <!-- Hero Central Mark: Modern RouterOS RIF Hexagon Frame -->
  <g filter="url(#shadow-c)">
    <!-- Hex / Cube Container -->
    <polygon points="256 112 384 186 384 334 256 408 128 334 128 186" 
             fill="#0C1526" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Top Face / MikroTik Crest -->
    <g transform="translate(204, 138) scale(1.5)">
      <path d="M 0 6 C 0.3 5.9 0.4 6.1 0.4 6.3 C 1.2 20.2 7.1 30.8 14.9 38 C 22.7 45.2 33.2 51.1 47.9 50.8 C 20.3 61.8 -8.7 35.4 0.2 6 Z" fill="url(#m-grad)" opacity="0.95"/>
      <path d="M 12.5 2 C 15.65 23.86 27.38 37.13 51.29 38.22 C 28.76 46.84 5.54 26.58 12.5 2 Z" fill="url(#m-grad)"/>
    </g>

    <!-- Network Data Links & Verification Nodes -->
    <line x1="172" y1="280" x2="340" y2="280" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 6"/>
    
    <!-- Audit Checkmark Emblem -->
    <circle cx="256" cy="326" r="38" fill="#0A111F" stroke="#10B981" stroke-width="3"/>
    <path d="M 240 326 L 251 337 L 273 315" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
