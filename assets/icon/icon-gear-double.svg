<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1A2E"/>
      <stop offset="50%" stop-color="#0B1323"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="g2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="g2-glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="g2-wave" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <linearGradient id="g2-gear-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="g2-audit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="g2-shadow-router" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="g2-shadow-gear" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="g2-shadow-badge" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#g2-bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#g2-glow)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" ry="102.5" fill="none" stroke="url(#g2-rim)" stroke-width="3"/>

  <!-- Diagnostic Gears (Engranajes de Diagnóstico Técnico) -->
  <g filter="url(#g2-shadow-gear)">
    <!-- Main Left Gear -->
    <path d="M 158.75 208.86 L 169.53 211.57 L 169.53 224.43 L 158.75 227.14 L 150.29 241.79 L 153.33 252.48 L 142.20 258.91 L 134.46 250.93 L 117.54 250.93 L 109.80 258.91 L 98.67 252.48 L 101.71 241.79 L 93.25 227.14 L 82.47 224.43 L 82.47 211.57 L 93.25 208.86 L 101.71 194.21 L 98.67 183.52 L 109.80 177.09 L 117.54 185.07 L 134.46 185.07 L 142.20 177.09 L 153.33 183.52 L 150.29 194.21 Z M 142.00 218.00 L 141.69 214.88 L 140.78 211.88 L 139.30 209.11 L 137.31 206.69 L 134.89 204.70 L 132.12 203.22 L 129.12 202.31 L 126.00 202.00 L 122.88 202.31 L 119.88 203.22 L 117.11 204.70 L 114.69 206.69 L 112.70 209.11 L 111.22 211.88 L 110.31 214.88 L 110.00 218.00 L 110.31 221.12 L 111.22 224.12 L 112.70 226.89 L 114.69 229.31 L 117.11 231.30 L 119.88 232.78 L 122.88 233.69 L 126.00 234.00 L 129.12 233.69 L 132.12 232.78 L 134.89 231.30 L 137.31 229.31 L 139.30 226.89 L 140.78 224.12 L 141.69 221.12 Z" fill="url(#g2-gear-cyan)" fill-rule="evenodd"/>
    <circle cx="126" cy="218" r="34" fill="none" stroke="#7DD3FC" stroke-width="1.2" opacity="0.4"/>
    <circle cx="126" cy="218" r="16" fill="#0B1323" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Small Secondary Right Gear -->
    <path d="M 412.97 210.47 L 421.61 212.74 L 421.61 223.26 L 412.97 225.53 L 406.01 237.59 L 408.36 246.21 L 399.25 251.47 L 392.96 245.12 L 379.04 245.12 L 372.75 251.47 L 363.64 246.21 L 365.99 237.59 L 359.03 225.53 L 350.39 223.26 L 350.39 212.74 L 359.03 210.47 L 365.99 198.41 L 363.64 189.79 L 372.75 184.53 L 379.04 190.88 L 392.96 190.88 L 399.25 184.53 L 408.36 189.79 L 406.01 198.41 Z M 398.00 218.00 L 397.77 215.66 L 397.09 213.41 L 395.98 211.33 L 394.49 209.51 L 392.67 208.02 L 390.59 206.91 L 388.34 206.23 L 386.00 206.00 L 383.66 206.23 L 381.41 206.91 L 379.33 208.02 L 377.51 209.51 L 376.02 211.33 L 374.91 213.41 L 374.23 215.66 L 374.00 218.00 L 374.23 220.34 L 374.91 222.59 L 376.02 224.67 L 377.51 226.49 L 379.33 227.98 L 381.41 229.09 L 383.66 229.77 L 386.00 230.00 L 388.34 229.77 L 390.59 229.09 L 392.67 227.98 L 394.49 226.49 L 395.98 224.67 L 397.09 222.59 L 397.77 220.34 Z" fill="#1E293B" stroke="#334155" stroke-width="1.5" fill-rule="evenodd"/>
    <circle cx="386" cy="218" r="12" fill="#0B1323" stroke="#64748B" stroke-width="1.2"/>
  </g>

  <!-- MikroTik Waves -->
  <g transform="translate(196, 110) scale(1.65)">
    <path d="M 0 6 C 0.3 5.9 0.4 6.1 0.4 6.3 C 1.2 20.2 7.1 30.8 14.9 38 C 22.7 45.2 33.2 51.1 47.9 50.8 C 20.3 61.8 -8.7 35.4 0.2 6 Z" fill="url(#g2-wave)" opacity="0.95"/>
    <path d="M 12.5 2 C 15.65 23.86 27.38 37.13 51.29 38.22 C 28.76 46.84 5.54 26.58 12.5 2 Z" fill="url(#g2-wave)"/>
  </g>

  <!-- Router Console -->
  <g filter="url(#g2-shadow-router)">
    <rect x="100" y="248" width="312" height="130" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <path d="M 118 249 L 394 249" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    <rect x="118" y="278" width="276" height="74" rx="10" fill="#080D16" stroke="#1E293B" stroke-width="1"/>

    <!-- Ports -->
    <g transform="translate(136, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#38BDF8"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(168, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(200, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(232, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(264, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Audit Badge -->
  <g transform="translate(362, 344)" filter="url(#g2-shadow-badge)">
    <circle cx="0" cy="0" r="42" fill="#0B1323"/>
    <circle cx="0" cy="0" r="38" fill="url(#g2-audit)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#A7F3D0" stroke-width="2" opacity="0.6"/>
    <path d="M -15 0 L -4 11 L 16 -9" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
