<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1A2E"/>
      <stop offset="50%" stop-color="#0B1323"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="gw-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="gw-glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gw-wave" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <linearGradient id="gw-gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="gw-audit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="gw-shadow-router" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="gw-shadow-gear" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>

    <filter id="gw-shadow-badge" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#gw-bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#gw-glow)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" ry="102.5" fill="none" stroke="url(#gw-rim)" stroke-width="3"/>

  <!-- Technical Gear beside MikroTik (Engranaje Técnico al lado de las Ondas MikroTik) -->
  <g filter="url(#gw-shadow-gear)">
    <path d="M 180.82 139.39 L 191.55 141.86 L 191.55 154.14 L 180.82 156.61 L 172.86 170.39 L 176.09 180.92 L 165.46 187.05 L 157.96 178.99 L 142.04 178.99 L 134.54 187.05 L 123.91 180.92 L 127.14 170.39 L 119.18 156.61 L 108.45 154.14 L 108.45 141.86 L 119.18 139.39 L 127.14 125.61 L 123.91 115.08 L 134.54 108.95 L 142.04 117.01 L 157.96 117.01 L 165.46 108.95 L 176.09 115.08 L 172.86 125.61 Z M 166.00 148.00 L 165.69 144.88 L 164.78 141.88 L 163.30 139.11 L 161.31 136.69 L 158.89 134.70 L 156.12 133.22 L 153.12 132.31 L 150.00 132.00 L 146.88 132.31 L 143.88 133.22 L 141.11 134.70 L 138.69 136.69 L 136.70 139.11 L 135.22 141.88 L 134.31 144.88 L 134.00 148.00 L 134.31 151.12 L 135.22 154.12 L 136.70 156.89 L 138.69 159.31 L 141.11 161.30 L 143.88 162.78 L 146.88 163.69 L 150.00 164.00 L 153.12 163.69 L 156.12 162.78 L 158.89 161.30 L 161.31 159.31 L 163.30 156.89 L 164.78 154.12 L 165.69 151.12 Z" fill="url(#gw-gear)" fill-rule="evenodd"/>
    <circle cx="150" cy="148" r="32" fill="none" stroke="#7DD3FC" stroke-width="1.2" opacity="0.5"/>
    <circle cx="150" cy="148" r="16" fill="#0B1323" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="150" cy="148" r="5" fill="#38BDF8"/>

    <!-- Small interlocking companion gear -->
    <path d="M 131.26 188.62 L 137.72 190.20 L 137.72 197.80 L 131.26 199.38 L 126.29 207.99 L 128.15 214.38 L 121.57 218.17 L 116.97 213.37 L 107.03 213.37 L 102.43 218.17 L 95.85 214.38 L 97.71 207.99 L 92.74 199.38 L 86.28 197.80 L 86.28 190.20 L 92.74 188.62 L 97.71 180.01 L 95.85 173.62 L 102.43 169.83 L 107.03 174.63 L 116.97 174.63 L 121.57 169.83 L 128.15 173.62 L 126.29 180.01 Z M 122.00 194.00 L 121.81 192.05 L 121.24 190.17 L 120.31 188.44 L 119.07 186.93 L 117.56 185.69 L 115.83 184.76 L 113.95 184.19 L 112.00 184.00 L 110.05 184.19 L 108.17 184.76 L 106.44 185.69 L 104.93 186.93 L 103.69 188.44 L 102.76 190.17 L 102.19 192.05 L 102.00 194.00 L 102.19 195.95 L 102.76 197.83 L 103.69 199.56 L 104.93 201.07 L 106.44 202.31 L 108.17 203.24 L 110.05 203.81 L 112.00 204.00 L 113.95 203.81 L 115.83 203.24 L 117.56 202.31 L 119.07 201.07 L 120.31 199.56 L 121.24 197.83 L 121.81 195.95 Z" fill="#1E293B" stroke="#475569" stroke-width="1.5" fill-rule="evenodd"/>
    <circle cx="112" cy="194" r="10" fill="#0B1323" stroke="#64748B" stroke-width="1.2"/>
  </g>

  <!-- MikroTik Waves (Crest) -->
  <g transform="translate(232, 106) scale(1.65)">
    <path d="M 0 6 C 0.3 5.9 0.4 6.1 0.4 6.3 C 1.2 20.2 7.1 30.8 14.9 38 C 22.7 45.2 33.2 51.1 47.9 50.8 C 20.3 61.8 -8.7 35.4 0.2 6 Z" fill="url(#gw-wave)" opacity="0.95"/>
    <path d="M 12.5 2 C 15.65 23.86 27.38 37.13 51.29 38.22 C 28.76 46.84 5.54 26.58 12.5 2 Z" fill="url(#gw-wave)"/>
  </g>

  <!-- Router Console -->
  <g filter="url(#gw-shadow-router)">
    <rect x="100" y="248" width="312" height="130" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <path d="M 118 249 L 394 249" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    <rect x="118" y="278" width="276" height="74" rx="10" fill="#080D16" stroke="#1E293B" stroke-width="1"/>

    <!-- Interface Ports -->
    <g transform="translate(136, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#38BDF8"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(168, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(200, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(232, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(264, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Audit Verification Badge -->
  <g transform="translate(362, 344)" filter="url(#gw-shadow-badge)">
    <circle cx="0" cy="0" r="42" fill="#0B1323"/>
    <circle cx="0" cy="0" r="38" fill="url(#gw-audit)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#A7F3D0" stroke-width="2" opacity="0.6"/>
    <path d="M -15 0 L -4 11 L 16 -9" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
