<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1A2E"/>
      <stop offset="50%" stop-color="#0B1323"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="g1-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="g1-glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="g1-wave" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <linearGradient id="g1-router" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Support Gear Gradient: Precision Steel & Emerald Glow -->
    <linearGradient id="g1-gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="g1-gear-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1526"/>
      <stop offset="100%" stop-color="#050C16"/>
    </linearGradient>

    <filter id="g1-shadow-router" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="g1-shadow-gear" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#g1-bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#g1-glow)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" ry="102.5" fill="none" stroke="url(#g1-rim)" stroke-width="3"/>

  <!-- MikroTik Signature Radio Waves -->
  <g transform="translate(196, 110) scale(1.65)">
    <path d="M 0 6 C 0.3 5.9 0.4 6.1 0.4 6.3 C 1.2 20.2 7.1 30.8 14.9 38 C 22.7 45.2 33.2 51.1 47.9 50.8 C 20.3 61.8 -8.7 35.4 0.2 6 Z" fill="url(#g1-wave)" opacity="0.95"/>
    <path d="M 12.5 2 C 15.65 23.86 27.38 37.13 51.29 38.22 C 28.76 46.84 5.54 26.58 12.5 2 Z" fill="url(#g1-wave)"/>
  </g>

  <!-- Router Console -->
  <g filter="url(#g1-shadow-router)">
    <rect x="100" y="248" width="312" height="130" rx="18" fill="url(#g1-router)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 118 249 L 394 249" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    <rect x="118" y="278" width="276" height="74" rx="10" fill="#080D16" stroke="#1E293B" stroke-width="1"/>

    <!-- Interface Ports -->
    <g transform="translate(136, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#38BDF8"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(168, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(200, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(232, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(264, 298)">
      <circle cx="10" cy="0" r="2.5" fill="#10B981"/>
      <rect x="0" y="6" width="20" height="24" rx="4" fill="#0B1322" stroke="#334155" stroke-width="1.5"/>
      <line x1="6" y1="12" x2="14" y2="12" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Support Gear + Audit Checkmark Badge (El Engranaje Técnico + Check) -->
  <g filter="url(#g1-shadow-gear)">
    <!-- Outer Gear Silhouette -->
    <path d="M 405.17 331.89 L 415.70 334.51 L 415.70 345.49 L 405.17 348.11 L 399.43 361.96 L 405.02 371.26 L 397.26 379.02 L 387.96 373.43 L 374.11 379.17 L 371.49 389.70 L 360.51 389.70 L 357.89 379.17 L 344.04 373.43 L 334.74 379.02 L 326.98 371.26 L 332.57 361.96 L 326.83 348.11 L 316.30 345.49 L 316.30 334.51 L 326.83 331.89 L 332.57 318.04 L 326.98 308.74 L 334.74 300.98 L 344.04 306.57 L 357.89 300.83 L 360.51 290.30 L 371.49 290.30 L 374.11 300.83 L 387.96 306.57 L 397.26 300.98 L 405.02 308.74 L 399.43 318.04 Z M 393.00 340.00 L 392.48 334.73 L 390.94 329.67 L 388.45 325.00 L 385.09 320.91 L 381.00 317.55 L 376.33 315.06 L 371.27 313.52 L 366.00 313.00 L 360.73 313.52 L 355.67 315.06 L 351.00 317.55 L 346.91 320.91 L 343.55 325.00 L 341.06 329.67 L 339.52 334.73 L 339.00 340.00 L 339.52 345.27 L 341.06 350.33 L 343.55 355.00 L 346.91 359.09 L 351.00 362.45 L 355.67 364.94 L 360.73 366.48 L 366.00 367.00 L 371.27 366.48 L 376.33 364.94 L 381.00 362.45 L 385.09 359.09 L 388.45 355.00 L 390.94 350.33 L 392.48 345.27 Z" fill="url(#g1-gear)" fill-rule="evenodd"/>
    
    <!-- Central Hub Background -->
    <circle cx="366" cy="340" r="26" fill="url(#g1-gear-body)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Inner Verification Checkmark -->
    <path d="M 353 340 L 362 349 L 379 332" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
