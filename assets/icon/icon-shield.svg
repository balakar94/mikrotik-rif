<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E192D"/>
      <stop offset="50%" stop-color="#091120"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>

    <linearGradient id="rim-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.04"/>
    </linearGradient>

    <radialGradient id="glow-b" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#111B2C"/>
      <stop offset="100%" stop-color="#080E18"/>
    </linearGradient>

    <linearGradient id="shield-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="wave-grad-b" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <linearGradient id="check-grad-b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="shadow-shield" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="glow-check" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-b)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#glow-b)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" ry="102.5" fill="none" stroke="url(#rim-b)" stroke-width="3"/>

  <!-- Audit Shield -->
  <g filter="url(#shadow-shield)">
    <!-- Outer Shield Contour -->
    <path d="M 256 108 C 344 108, 388 126, 388 174 C 388 278, 324 354, 256 398 C 188 354, 124 278, 124 174 C 124 126, 168 108, 256 108 Z" 
          fill="url(#shield-grad)"/>
    <path d="M 256 108 C 344 108, 388 126, 388 174 C 388 278, 324 354, 256 398 C 188 354, 124 278, 124 174 C 124 126, 168 108, 256 108 Z" 
          fill="none" stroke="url(#shield-border)" stroke-width="3.5"/>

    <!-- Subtle Inner Shield Inset -->
    <path d="M 256 124 C 330 124, 368 140, 368 180 C 368 268, 312 334, 256 374 C 200 334, 144 268, 144 180 C 144 140, 182 124, 256 124 Z" 
          fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.25"/>

    <!-- MikroTik Radio Waves at Top of Shield -->
    <g transform="translate(208, 150) scale(1.45)">
      <path d="M 0 6 C 0.3 5.9 0.4 6.1 0.4 6.3 C 1.2 20.2 7.1 30.8 14.9 38 C 22.7 45.2 33.2 51.1 47.9 50.8 C 20.3 61.8 -8.7 35.4 0.2 6 Z" fill="url(#wave-grad-b)" opacity="0.95"/>
      <path d="M 12.5 2 C 15.65 23.86 27.38 37.13 51.29 38.22 C 28.76 46.84 5.54 26.58 12.5 2 Z" fill="url(#wave-grad-b)"/>
    </g>

    <!-- Network Diagnostic Pulse Line / Divider -->
    <g transform="translate(164, 256)">
      <line x1="0" y1="0" x2="52" y2="0" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="0" r="4" fill="#38BDF8"/>
      <line x1="68" y1="0" x2="116" y2="0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="124" cy="0" r="4" fill="#10B981"/>
      <line x1="132" y1="0" x2="184" y2="0" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Prominent Audit Verification Checkmark -->
    <g transform="translate(256, 320)" filter="url(#glow-check)">
      <circle cx="0" cy="0" r="32" fill="#0A1424" stroke="#10B981" stroke-width="2.5"/>
      <path d="M -13 0 L -4 9 L 14 -8" fill="none" stroke="url(#check-grad-b)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
