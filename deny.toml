# cargo-deny policy for mikrotik-rif.
#
# Validated locally with: cargo-deny 0.19.0
#   cargo deny list -f tsv          # to enumerate real licenses in the tree
#   cargo deny check advisories licenses
# CI installs the same pinned version with:
#   cargo install cargo-deny --locked --version 0.19.0
# and runs: cargo deny check advisories licenses
#
# Only `advisories` and `licenses` are configured on purpose. `cargo deny check`
# without arguments still passes today (bans/sources use permissive defaults),
# but CI invokes the two checks explicitly so future default changes in
# bans/sources cannot break or silently widen this policy.

# ─────────────────────────────────────────────────────────────────────────────
# Advisories (RustSec): any vulnerability is an error and fails the check.
# yanked = deny so a yanked crate fails instead of warning.
# unmaintained = all / unsound = all so transitive advisories also fail.
# ─────────────────────────────────────────────────────────────────────────────
[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Real open advisories on 2026-09-13, kept as `ignore` with follow-up instead
# of hiding the problem. Each entry must be removed once the Cargo.lock fix
# lands (Cargo.lock changes are out of scope for this policy-only change).
# NOTE: re-run `cargo deny check advisories` after any dependency bump and
# drop the entries that no longer fire; `unused-ignored-advisory` below warns
# when an entry becomes stale.
ignore = [
    # quick-xml 0.38.4 via zbus_xml -> atspi -> accesskit -> eframe 0.36.
    # Fix: `cargo update -p quick-xml` to >= 0.41.0 (requires Cargo.lock change).
    { id = "RUSTSEC-2026-0194", reason = "TODO(follow-up): quadratic runtime in BytesStart::attributes duplicate check; upgrade quick-xml to >=0.41.0 via Cargo.lock" },
    # Same crate/path as above (NsReader unbounded namespace allocation).
    # Same fix as RUSTSEC-2026-0194.
    { id = "RUSTSEC-2026-0195", reason = "TODO(follow-up): NsReader memory-exhaustion DoS; upgrade quick-xml to >=0.41.0 via Cargo.lock" },
    # ttf-parser 0.25.1 via owned_ttf_parser -> ab_glyph -> winit -> eframe 0.36.
    # No safe upgrade available; upstream alternative is skrifa, which requires
    # an eframe migration (requires Cargo.lock / dependency change).
    { id = "RUSTSEC-2026-0192", reason = "TODO(follow-up): ttf-parser unmaintained; track eframe migration to skrifa" },
]
unused-ignored-advisory = "warn"

# ─────────────────────────────────────────────────────────────────────────────
# Licenses: deny-by-default, only the SPDX identifiers below are allowed.
# Enumerated from `cargo deny list -f tsv` on 2026-09-13 (~413 crates):
#   MIT (372), Apache-2.0 (300), Unicode-3.0 (19, ICU stack), Zlib (19),
#   Apache-2.0 WITH LLVM-exception (6, rustix/linux-raw-sys),
#   BSD-3-Clause (6, tiny-skia/moxcms/pxfm), Unlicense (5, MIT duals),
#   BSD-2-Clause (3, incl. arrayref sole), BSL-1.0 (2, clipboard-win/error-code),
#   OFL-1.1 + Ubuntu-font-1.0 (epaint_default_fonts, embedded fonts),
#   ISC (libloading sole), 0BSD (adler2, MIT/Apache dual).
# Copyleft (GPL-2.0-only via self_cell, LGPL-2.1-or-later via r-efi) is
# intentionally NOT allowed: those crates are dual-licensed with Apache-2.0/MIT
# alternatives, so `cargo deny check licenses` passes without permitting
# copyleft. Do not add GPL/LGPL identifiers unless a sole-copyleft crate
# appears in the tree.
# ─────────────────────────────────────────────────────────────────────────────
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # webpki-roots sole (Mozilla CA bundle behind ureq's HTTPS): the
    # Community Data License Agreement (Permissive 2.0) is a permissive,
    # non-copyleft data license — use, modify and redistribute freely,
    # keep the notices. No code is covered by it, only the certificate list.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Warn (don't fail) when an allowed license becomes unused, so removing a
# dependency doesn't break CI for the wrong reason. Review warnings on bump PRs.
unused-allowed-license = "warn"
